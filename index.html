     ・刀一本の一次元の立ち合い。体力と「体幹」の二本のゲージ
     ・斬る／受ける／当たる直前に受けて「弾く」。弾かれた側は体幹を大きく削られる
     ・長押しの「溜め斬り」は、離す瞬間が読めない＝弾きの拍子を外す読み合い
     ・壁を背負うと体幹の削れが1.5倍。場所の取り合い
     ・体幹が尽きれば棒立ち → 「致命の一撃」
   弐での進化：
     ・「突き」（危）… ガードでは防げない。読んで「見切り」（相手へ踏み込みながら受ける）で踏みつけ、大きく体幹を崩す
       → 斬る／守る／弾く に加え、「固めた守りを突く」「突きを見切る」という三すくみが生まれる
     ・「踏み込み・退き」… 方向キー二度押しの素早い一歩。溜め斬りを空振りさせ、間合いを奪う
     ・四つの流派（正眼・大太刀・小太刀・居合）と八人の剣客。間合いと拍子が変わる
     ・一人用「十番勝負」は全員と順に立ち合う。二人用は同じ画面とフレンド対戦（巻き戻し同期）
   ========================================================================= */

  // 真打 無銘：十の流派それぞれの最も優れた所を一つに束ねた流派（一人用で、条件を満たした時だけ現れる）
  //   間合い・威力・崩し＝大太刀　振りの速さ・突き・足・踏み込み＝下段　振り終わり＝木刀／二刀　溜め＝居合

/* ===================================================================== */
const lerp = (a, b, t) => a + (b - a) * t;

/* =====================================================================
   サウンド（Web Audio による合成音）
   ===================================================================== */
const Snd = {
  ctx: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -16; this.comp.knee.value = 10; this.comp.ratio.value = 5;
    this.comp.attack.value = 0.002; this.comp.release.value = 0.2;
    this.master = c.createGain(); this.master.gain.value = 0.85;
    this.master.connect(this.comp); this.comp.connect(c.destination);
    this.rev = c.createConvolver(); this.rev.buffer = this.makeIR(2.6, 2.8);
    const rg = c.createGain(); rg.gain.value = 0.55; this.rev.connect(rg); rg.connect(this.master);
    this.room = c.createConvolver(); this.room.buffer = this.makeIR(0.7, 4.5);
    const rmg = c.createGain(); rmg.gain.value = 0.8; this.room.connect(rmg); rmg.connect(this.master);
    const len = c.sampleRate * 2, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = Math.tanh(4 * x) / Math.tanh(4); }
    this.distCurve = curve;
    // 音楽と環境音の経路（音楽は独自の残響を持ち、まとめて消せる）
    this.music = c.createGain(); this.music.gain.value = Music.on ? Music.VOL : 0; this.music.connect(this.master);
    this.mrev = c.createConvolver(); this.mrev.buffer = this.makeIR(3.2, 2.4);
    const mg = c.createGain(); mg.gain.value = 0.7; this.mrev.connect(mg); mg.connect(this.music);
    this.amb = c.createGain(); this.amb.gain.value = 0.16; this.amb.connect(this.master);
    Amb.start(Amb.want);
  },
  makeIR(sec, decay) {
    const c = this.ctx, len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return b;
  },
  out(send, room = 0, bus = null) {
    const g = this.ctx.createGain(); g.connect(bus || this.master);
    if (send > 0) { const s = this.ctx.createGain(); s.gain.value = send; g.connect(s); s.connect(bus ? this.mrev : this.rev); }
    if (room > 0) { const s = this.ctx.createGain(); s.gain.value = room; g.connect(s); s.connect(this.room); }
    return g;
  },

function S(name, ...args) { if (!Snd.ctx || muteDepth > 0 || G.demo) return; try { Snd[name](...args); } catch (e) { /* 無視 */ } }

/* =====================================================================
   環境音（雨・風・鳥）… ループするノイズをフィルタで整える
   ===================================================================== */
const Amb = {
  want: null, cur: null, nodes: [],
  set(kind) { this.want = kind; if (Snd.ctx) this.start(kind); },
  start(kind) {
    if (this.cur === kind) return;
    const c = Snd.ctx;
    for (const n of this.nodes) { try { n.g.gain.setTargetAtTime(0, c.currentTime, 0.4); n.src.stop(c.currentTime + 2); } catch (e) { /* 無視 */ } }
    this.nodes = []; this.cur = kind;
    if (!kind) return;
    const loop = (type, f, q, vol, lfoRate = 0, lfoDepth = 0) => {
      const s = c.createBufferSource(); s.buffer = Snd.noiseBuf; s.loop = true;
      const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = c.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(vol, c.currentTime, 0.8);
      if (lfoRate) {
        const l = c.createOscillator(); l.frequency.value = lfoRate; const lg = c.createGain(); lg.gain.value = lfoDepth;
        l.connect(lg); lg.connect(fl.frequency); l.start(); s.onended = () => { try { l.stop(); } catch (e) { /* 無視 */ } };
      }
      s.connect(fl); fl.connect(g); g.connect(Snd.amb); s.start(0, Math.random() * 1.5);
      this.nodes.push({ src: s, g });
    };
    if (kind === 'rain') { loop('highpass', 1400, 0.4, 0.22); loop('bandpass', 5200, 0.6, 0.16); loop('lowpass', 260, 0.5, 0.12); }
    else if (kind === 'wind') { loop('bandpass', 480, 0.8, 0.16, 0.09, 260); loop('bandpass', 1300, 2.5, 0.04, 0.13, 500); }
    else if (kind === 'strongwind') { loop('bandpass', 420, 0.7, 0.26, 0.07, 300); loop('bandpass', 1500, 3, 0.07, 0.11, 700); }
    else if (kind === 'soft') { loop('lowpass', 380, 0.5, 0.08, 0.05, 120); }
    else if (kind === 'room') { loop('lowpass', 220, 0.5, 0.05); }
  },
  update(stageId) {
    if (!Snd.ctx || G.demo) return;
    if (stageId === 'dojo' && Math.random() < 0.004) S('chirp');
    if (stageId === 'maple' && Math.random() < 0.0012) S('crow');
  },
};

/* =====================================================================
   音楽（生成音楽）：箏（カープラス・ストロング合成）・尺八・和太鼓
   五音音階（都節＝陰旋法、民謡＝陽旋法）の上で、種を固定した乱数でフレーズを作る

  if (KOTO[m]) return KOTO[m];
  const c = Snd.ctx, sr = c.sampleRate, f = mtof(m), len = Math.floor(sr * 2.0);
  const N = Math.max(2, Math.round(sr / f)), ring = new Float32Array(N);
  let prev = 0;
  for (let i = 0; i < N; i++) { const r = Math.random() * 2 - 1; prev = prev * 0.35 + r * 0.65; ring[i] = prev; }
  const b = c.createBuffer(1, len, sr), d = b.getChannelData(0);
  const decay = clamp(0.9992 - (m - 45) * 0.00009, 0.9955, 0.9995);
  let idx = 0;
  for (let i = 0; i < len; i++) {
    const a = ring[idx], nb = ring[(idx + 1) % N];
    ring[idx] = (a + nb) * 0.5 * decay; d[i] = a; idx = (idx + 1) % N;

  koto(m, at, vel = 0.25, bend = 0) {
    const c = Snd.ctx, s = c.createBufferSource(); s.buffer = kotoBuf(m);
    if (bend) { s.playbackRate.setValueAtTime(1, at + 0.1); s.playbackRate.linearRampToValueAtTime(Math.pow(2, bend / 12), at + 0.32); }
    const g = c.createGain(); g.gain.value = vel;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 3800;
    s.connect(fl); fl.connect(g); g.connect(Snd.music);
    const sg = c.createGain(); sg.gain.value = 0.35; g.connect(sg); sg.connect(Snd.mrev);
    s.start(at); s.stop(at + 2.0);
  },
  shaku(m, at, dur, vel = 0.07) {
    const c = Snd.ctx, f = mtof(m);

    g.gain.linearRampToValueAtTime(vel * 0.75, at + dur); g.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.35);
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 2600;
    fl.connect(g); g.connect(Snd.music);
    const sg = c.createGain(); sg.gain.value = 0.6; g.connect(sg); sg.connect(Snd.mrev);
    const lfo = c.createOscillator(); lfo.frequency.value = 5 + Math.random();
    const lg = c.createGain(); lg.gain.setValueAtTime(0, at); lg.gain.linearRampToValueAtTime(f * 0.011, at + Math.min(0.7, dur * 0.7));

      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f * 0.94, at); o.frequency.exponentialRampToValueAtTime(f, at + 0.14);
      lg.connect(o.frequency);

    const s = c.createBufferSource(); s.buffer = Snd.noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 1.5;
    const ng = c.createGain(); ng.gain.setValueAtTime(0.0001, at); ng.gain.exponentialRampToValueAtTime(vel * 0.9, at + 0.05);
    ng.gain.exponentialRampToValueAtTime(vel * 0.25, at + 0.3); ng.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.3);
    s.connect(bp); bp.connect(ng); ng.connect(fl); s.start(at, Math.random()); s.stop(at + dur + 0.4);

  don(at, vel = 0.8, f = 88) {

  },
  ka(at, vel = 0.3) {
    Snd.noise({ at, dur: 0.035, peak: vel, type: 'bandpass', f0: 2600, q: 2, bus: Snd.music });
    Snd.tone({ at, type: 'triangle', f0: 900, dur: 0.03, peak: vel * 0.3, bus: Snd.music });
  },
  drone(m, at, dur, vel = 0.05) {
    [0, 7].forEach((det, i) => Snd.tone({ at, f0: mtof(m) * (i ? 1.003 : 1), dur, peak: vel / (i + 1), attack: dur * 0.4, bus: Snd.music, send: 0.4 }));
  },
  rin(m, at, vel = 0.06) { // おりん
    [1, 2.76, 5.4].forEach((r, i) => Snd.tone({ at, f0: mtof(m) * r, dur: 3.5 - i, peak: vel / (1 + i), bus: Snd.music, send: 0.7 }));
  },

      this.noRetreat = (myRoom < Math.max(56, 40 + 80 * Sp) * U || opRoom < myRoom) && Math.random() < Math.max(C, Sp);

  }
  think(me, frame) {

    const out = { dir: 0, guard: false, atk: false, thr: false, step: 0, intent: false };
    this.now = frame;
    if (['hitstun', 'deflected', 'clash', 'broken', 'guardstun', 'trampled'].includes(me.state)) this.holdUntil = -1;
    if (!op) { this.emit(me, out); return; }
    const dist = Math.abs(op.x - me.x);
    const reach = me.S.reach + 8;
    const myRoom = roomBehind(me), opRoom = roomOf(op.x, me.x);
    const Sp = P.space;

    if (op.state === 'guard' || op.state === 'guardstun') this.oppGuardTime++; else this.oppGuardTime = 0;
    if (me.state === 'parry' && this.prevMeState !== 'parry') this.counter = Math.random() < P.counter;
    if (me.state === 'mikiri' && this.prevMeState !== 'mikiri') this.counter = Math.random() < Math.max(P.counter, 0.5);
    if (me.state === 'deflected' && this.prevMeState !== 'deflected' && me.chargeLv < 0.25 && me.kind === 'slash') this.parriedN++;
    if (me.state === 'trampled' && this.prevMeState !== 'trampled') this.mikiriedN++;

    const slowArm = me.S.startup >= 24;   // 振りの遅い者（居合・後の先）は、間に合わない打ち込みをしない
    const planParry = (hitFrame, win, fwd) => {
      const press = hitFrame - randInt(2, win - 2) + randInt(-P.parryError, P.parryError);
      this.plan = { type: 'parry', press: Math.max(press, frame), end: hitFrame + 10, pressed: false, fwd };
    };
    // 連打を見抜く：短い間に何度も斬りかかってくる相手には、拍子を合わせて弾き、振り終わりを咎める（腕の立つ相手ほど）
    const recent = this.oppSwings.filter(t => op.frame - t < 150).length;
    const mash = recent >= 3 ? clamp((recent - 2) * 0.3, 0, 0.9) * (0.15 + P.read * 0.85) : 0;
    const planFor = hitFrame => {
      if (Math.random() < Math.min(1, P.parryChance + mash)) planParry(hitFrame, F.PARRY_WINDOW, false);
      else this.plan = { type: 'guard', end: hitFrame + 10 };
    };
    if (op.state === 'attack' && op.phase !== 'recovery' && op.atkId !== this.handledAtk) {
      this.handledAtk = op.atkId;
      if (op.kind === 'slash') { this.oppSwings.push(op.atkStart); if (this.oppSwings.length > 8) this.oppSwings.shift(); }
      if (op.kind === 'thrust') {
        if (!committed && op.hitAt !== null && dist <= op.reach + 30 * U) {
          const r = Math.random();
          if (r < P.mikiri) planParry(op.hitAt, F.THRUST_WINDOW, true);
          else if (r < P.mikiri + (1 - P.mikiri) * P.parryChance * 0.5) planParry(op.hitAt, F.THRUST_WINDOW, false);
          else if (Math.random() < P.evade && !me.wallBehind() && myRoom > 40 * U) this.plan = { type: 'evade', atkId: op.atkId, end: op.hitAt + 6, stepped: false };
          else if (Math.random() < P.guardChance) this.plan = { type: 'guard', end: op.hitAt + 8 };   // 突きをガードしてしまう（読み負け）
        }

    }
    // 1b. 相手が溜めに入った
    if (op.state === 'attack' && op.charging && op.atkId !== this.chargeSeen) {
      this.chargeSeen = op.atkId;
      if (!committed) {

        if (!me.wallBehind() && dist < op.reach + 24 * U && r < P.evade && (myRoom > (32 + 60 * Sp) * U || Math.random() > P.corner)) this.plan = { type: 'evade', atkId: op.atkId, end: frame + 60, stepped: false };
        else if (Math.random() < P.guardChance) {
          if (Math.random() < P.read) {
            const start = op.atkStart + op.cat;
            const hold = this.tempo.length ? pick(this.tempo) + randInt(-2, 2) : randInt(4, 42);
            const press = start + hold + (op.su - op.cat) - randInt(2, F.PARRY_WINDOW_CHARGE - 2);
            this.plan = { type: 'parry', press: Math.max(frame, press), end: frame + 62, pressed: false, atkId: op.atkId, fwd: false };
          } else this.plan = { type: 'guard', atkId: op.atkId, end: frame + 62 };

      }
    }
    // 1c. 溜めを離した瞬間が見えた
    if (op.state === 'attack' && op.kind === 'slash' && !op.charging && op.chargeT > 0 && op.hitAt !== null && op.atkId !== this.releaseSeen) {
      this.releaseSeen = op.atkId;
      this.tempo.push(op.chargeT); if (this.tempo.length > 6) this.tempo.shift();

    }
    // 1d. 自分が溜めている時
    if (me.charging) {
      if (op.guardPress !== this.feintSeen && op.frame - op.guardPress < 3 && op.frame - op.guardPress >= 0) {
        this.feintSeen = op.guardPress;
        if (Math.random() < P.feint) this.holdUntil = frame;
      }
      if (op.state === 'attack' && op.phase === 'startup' && !op.charging) this.holdUntil = Math.min(this.holdUntil, frame);
    }
    if (this.plan && this.plan.atkId !== undefined && (op.atkId !== this.plan.atkId || op.state !== 'attack' || op.phase === 'recovery')) this.plan = null;
    if (this.plan) {
      if (frame > this.plan.end) this.plan = null;
      else if (this.plan.type === 'evade') {

    const hp0 = this.hist[Math.max(0, this.hist.length - 1 - P.reaction - 4)];

    this.chaseSeen = opStun;
    if (this.chase && opStun && dist > me.S.reach) { out.dir = me.facing; this.emit(me, out); return; }

    if (Sp > 0 && myRoom < zone && myRoom < opRoom + 10 * U && me.canAct() && !(op.state === 'attack' && op.phase !== 'recovery')) {

    trail: null, sheathed: false, overhead: null, kiken: false, vis: -1 };

    case 'walk': {

          const k = (t - su + 1) / ac;

        } else {
          const r = t - su - ac, k = backTo(12), arc = Math.sin(k * Math.PI);
          P.gx = lerp(15, B.gx, k); P.gy = lerp(-26, B.gy, k); P.ang = lerp(-38, B.ang, k);
          if (S.stance === 'gedan') { P.gx -= arc * 5; P.gy -= arc * 3; P.ang -= arc * (S.pole ? 6 : 14); }   // 刃を手元へ引き戻しながら、低く構え直す
          P.lean = Math.round(lerp(3, B.lean, k)); P.cr = Math.round(lerp(B.cr, B.cr, k));
          P.ff = Math.round(lerp(11, B.ff, k)); P.fb = Math.round(lerp(-9, B.fb, k));

    case 'guardstun': P.overhead = { x: -1, y: 2 }; P.lean = -2; P.oy = 1; P.fb = -9; break;
    case 'parry': P.overhead = { x: 1, y: -1 }; P.lean = 1; P.ff = 8; break;

      const t = f.timer;

/* =====================================================================
   侍の描画（ドット絵を部位ごとに組み立てる）
   ===================================================================== */
function makePen(g, cx, cy, fc) {
  const R = (lx, ly, w, h, col) => { if (!col) return; g.fillStyle = col; const x = Math.round(lx), y = Math.round(ly); g.fillRect(fc > 0 ? cx + x : cx - x - w, cy + y, w, h); };
  const L = (x0, y0, x1, y1, col, th = 1) => {
    if (!col) return;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    const o = th >> 1;
    for (let i = 0; i <= n; i++) R(Math.round(x0 + (x1 - x0) * i / n) - o, Math.round(y0 + (y1 - y0) * i / n) - o, th, th, col);
  };
  const POLY = (pts, col) => {
    if (!col) return;
    g.fillStyle = col;
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
    y0 = Math.floor(y0); y1 = Math.ceil(y1);
    const n = pts.length, xs = [];
    for (let y = y0; y < y1; y++) {
      const Y = y + 0.5; xs.length = 0;
      for (let i = 0; i < n; i++) {
        const a = pts[i], b = pts[(i + 1) % n];
        if ((a[1] <= Y && b[1] > Y) || (b[1] <= Y && a[1] > Y)) xs.push(a[0] + (Y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
      }
      xs.sort((p, q) => p - q);
      for (let i = 0; i + 1 < xs.length; i += 2) {
        const xl = Math.floor(xs[i] + 0.5), xr = Math.floor(xs[i + 1] - 0.5);
        if (xr >= xl) g.fillRect(fc > 0 ? cx + xl : cx - xr - 1, cy + y, xr - xl + 1, 1);
      }
    }
  };
  return { R, L, POLY };
}

// ---- 試合状態の保存と復元（巻き戻し同期と「決着の一瞬」の再生に使う） ----
const FKEYS = ['x', 'vx', 'facing', 'hp', 'posture', 'state', 'timer', 'dur', 'kind', 'tapAtk', 'tapGuard', 'tapThr', 'stepReq', 'parryIntent',
  'atkBuffer', 'thrBuffer', 'stepBuffer', 'stepDir', 'walkBuf', 'walkBufDir', 'atkHit', 'atkId', 'atkStartFrame', 'recoil', 'charging', 'chargeT', 'chargeLv', 'chargeStart',
  'guardPressFrame', 'lastGuardPress', 'parryEligible', 'pressFwd', 'guardMin', 'guardChain', 'chainTimer', 'regenDelay', 'walkCycle', 'moveDir',
  'prevDir', 'pressStart', 'releaseFrame', 'lastTapDir', 'lastTapLen', 'chordA', 'chordG'];
function snapF(f) { const o = {}; for (const k of FKEYS) o[k] = f[k]; o.input = Object.assign({}, f.input); o.stats = Object.assign({}, f.stats); return o; }
function loadF(f, o) { for (const k of FKEYS) f[k] = o[k]; f.input = Object.assign({}, o.input); f.stats = Object.assign({}, o.stats); }
function saveState() {
  return { p: snapF(G.p), c: snapF(G.c), frame: G.frame, hitstop: G.hitstop, slow: G.slow, mode: G.mode, introT: G.introT, koT: G.koT,
    winner: G.winner === G.p ? 'p' : G.winner === G.c ? 'c' : null, finisher: G.finisher };
}
function loadState(s) {
  loadF(G.p, s.p); loadF(G.c, s.c);
  G.frame = s.frame; G.hitstop = s.hitstop; G.slow = s.slow; G.mode = s.mode; G.introT = s.introT; G.koT = s.koT; G.finisher = s.finisher;
  G.winner = s.winner === 'p' ? G.p : s.winner === 'c' ? G.c : null;
}
function stateSum(s) { const str = JSON.stringify(s); let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return h; }

// ---- 入力をビットで表す ----
const IN_L = 1, IN_R = 2, IN_G = 4, IN_ATK = 8, IN_GTAP = 16, IN_A = 32, IN_THR = 64, IN_SF = 128, IN_SB = 256, IN_PI = 512;
const IN_HOLD = IN_L | IN_R | IN_G | IN_A;
function encodeF(f) {
  let b = 0;
  if (f.input.dir < 0) b |= IN_L; if (f.input.dir > 0) b |= IN_R; if (f.input.guard) b |= IN_G; if (f.input.atk) b |= IN_A;
  if (f.tapAtk) b |= IN_ATK; if (f.tapGuard) b |= IN_GTAP; if (f.tapThr) b |= IN_THR;
  if (f.stepReq > 0) b |= IN_SF; if (f.stepReq < 0) b |= IN_SB; if (f.parryIntent) b |= IN_PI;
  return b;
}
function applyBitsSet(f, b) {
  f.input.dir = (b & IN_R ? 1 : 0) - (b & IN_L ? 1 : 0); f.input.guard = !!(b & IN_G); f.input.atk = !!(b & IN_A);
  f.tapAtk = !!(b & IN_ATK); f.tapGuard = !!(b & IN_GTAP); f.tapThr = !!(b & IN_THR);
  f.stepReq = b & IN_SF ? 1 : b & IN_SB ? -1 : 0; f.parryIntent = !!(b & IN_PI);
}
function applyBitsOr(f, b) {   // オンライン：押した瞬間は、ヒットストップ中でも次に動ける時まで覚えておく
  f.input.dir = (b & IN_R ? 1 : 0) - (b & IN_L ? 1 : 0); f.input.guard = !!(b & IN_G); f.input.atk = !!(b & IN_A);
  if (b & IN_ATK) f.tapAtk = true; if (b & IN_GTAP) f.tapGuard = true; if (b & IN_THR) f.tapThr = true;
}

// ---- キー割り当て ----
const KEYS = {
  solo: { L: ['ArrowLeft', 'KeyA', 'Pad0L', 'Pad1L'], R: ['ArrowRight', 'KeyD', 'Pad0R', 'Pad1R'], A: ['KeyZ', 'KeyJ', 'KeyF', 'Pad0A', 'Pad1A'],
    G: ['KeyX', 'KeyK', 'KeyG', 'Pad0G', 'Pad1G'], T: ['KeyC', 'KeyL', 'KeyH', 'Pad0T', 'Pad1T'] },
  p1: { L: ['KeyA', 'Pad0L'], R: ['KeyD', 'Pad0R'], A: ['KeyF', 'Pad0A'], G: ['KeyG', 'Pad0G'], T: ['KeyH', 'Pad0T'] },
  p2: { L: ['ArrowLeft', 'Pad1L'], R: ['ArrowRight', 'Pad1R'], A: ['KeyK', 'Comma', 'Numpad1', 'Pad1A'], G: ['KeyL', 'Period', 'Numpad2', 'Pad1G'],
    T: ['Semicolon', 'Slash', 'Numpad3', 'Pad1T'] },
};
const MK = {
  up: ['ArrowUp', 'KeyW', 'Pad0U', 'Pad1U'], down: ['ArrowDown', 'KeyS', 'Pad0D', 'Pad1D'],
  left: ['ArrowLeft', 'KeyA', 'Pad0L', 'Pad1L'], right: ['ArrowRight', 'KeyD', 'Pad0R', 'Pad1R'],
  ok: ['Enter', 'NumpadEnter', 'Space', 'KeyZ', 'KeyF', 'KeyJ', 'Pad0A', 'Pad1A', 'Pad0G', 'Pad1G', 'Pad0S', 'Pad1S'],
  back: ['Escape', 'Pad0E', 'Pad1E'],

const keys = {};
const held = arr => arr.some(k => keys[k]);
function humanFeed(f, map, pr) {
  f.input.dir = (held(map.R) ? 1 : 0) - (held(map.L) ? 1 : 0);
  f.input.guard = held(map.G); f.input.atk = held(map.A);
  if (map.A.some(k => pr.has(k))) f.tapAtk = true;
  if (map.G.some(k => pr.has(k))) f.tapGuard = true;
  if (map.T.some(k => pr.has(k))) f.tapThr = true;
}

/* =====================================================================
   試合の進行（1フレーム分）
   ===================================================================== */
function fightStep(active) {
  if (G.hitstop > 0) { G.hitstop--; return; }
  if (G.slow > 0) { G.slow--; if (G.slow % 3 !== 0) return; }
  const p = G.p, c = G.c;
  if (active) {
    if (G.replay) { const b = G.replay.cur; if (b) { applyBitsSet(p, b[0]); applyBitsSet(c, b[1]); } }
    else if (!G.net) {
      if (G.ai[0]) G.ai[0].think(p, G.frame);
      if (G.ai[1]) G.ai[1].think(c, G.frame);
      if (G.botFn) G.botFn(p, c);
      G.lastBits = [encodeF(p), encodeF(c)];
    }
  } else {
    for (const f of [p, c]) { f.input = { dir: 0, guard: false, atk: false }; f.tapAtk = f.tapGuard = f.tapThr = false; f.stepReq = 0; }
  }
  p.update(c, G.frame);
  c.update(p, G.frame);
  separate(p, c);
  if (active) resolveCombat(p, c);
  // 斬り合いで画面が止まったら、同時押しの受付は打ち切る（弾いた直後の反撃が突きに化けないように）
  if (G.hitstop > 0) for (const f of [p, c]) { f.chordA = -999; f.chordG = -999; }
  if (!G.replay) { if (G.ai[1]) G.ai[1].record(p); if (G.ai[0]) G.ai[0].record(c); }
  G.frame++;
  if (active && !G.noKO && (p.hp <= 0 || c.hp <= 0)) { G.mode = 'ko'; G.koT = 0; G.winner = p.hp > 0 ? p : c; }
}
function simTick() {
  if (G.mode === 'intro') {
    G.introT++;
    if (G.introT === 4) visual('taiko1', () => S('taiko'));
    if (G.introT === 60) visual('taiko2', () => { S('taiko'); S('taiko', 0.13); });
    if (G.introT >= F.INTRO) G.mode = 'fight';
  } else if (G.mode === 'fight') fightStep(true);
  else if (G.mode === 'ko') {
    G.koT++;
    fightStep(false);
    if (G.koT === 26) visual('gong', () => S('gong'));
    if (G.koT === 70 && G.winner && G.winner.state !== 'dead') G.winner.setState('win');
    if (G.winner && G.winner.state === 'win' && G.winner.timer === 75) visual('sheathe', () => S('sheathe'));
  }
}
function updateBars() {
  if (!G.p) return;
  for (const f of [G.p, G.c]) {
    if (f.hpView > f.hp) f.hpView = Math.max(f.hp, f.hpView - 0.45); else if (f.hpView < f.hp) f.hpView = f.hp;
    if (f.postureView < f.posture) f.postureView = Math.min(f.posture, f.postureView + 0.45); else f.postureView = f.posture;
    if (f.flash > 0) f.flash--;
  }
}
function musicIntensity() {
  if (!G.p) return;
  const lo = Math.min(G.p.hp / G.p.hpMax, G.c.hp / G.c.hpMax), po = Math.max(G.p.posture, G.c.posture) / 100;
  let I = clamp((1 - lo) * 0.85 + po * 0.3, 0, 1);
  if (STAGE_CUR && STAGE_CUR.music && STAGE_CUR.music[3]) I = Math.max(I, 0.45);
  Music.intensity += (I - Music.intensity) * 0.02;
}

function tutBot(p, c) {

function tutTick(anyOf, pr) {

function tick() {
  G.time++;
  pollPads();
  if (STAGE_CUR) { STAGE_CUR.t++; if (STAGE_CUR.update) STAGE_CUR.update(STAGE_CUR, STAGE_CUR.t, G.p && G.mode !== 'title' ? [G.p, G.c] : null); Amb.update(STAGE_CUR.id); }

  const any = (...ks) => ks.some(k => pr.has(k)), anyOf = arr => arr.some(k => pr.has(k));
  if (pr.has('KeyM')) Music.toggle();
  if (G.net && G.net.connected) netWatch();
  if (G.net && G.net.inMatch) { updateBars(); netTick(any, pr); musicIntensity(); return; }
  if (G.replay) { replayTick(anyOf); return; }
  const m = G.mode;
  if (m === 'title') {
    if (G.p) {
      G.mode = G.demoPhase; simTick(); G.demoPhase = G.mode; G.mode = 'title'; updateBars();
      if (G.demoPhase === 'ko' && G.koT > 170) demoMatch();
    }
    const menu = titleMenu(), N = menu.length;
    if (anyOf(MK.up)) { G.sel = (G.sel + N - 1) % N; S('select'); }
    if (anyOf(MK.down)) { G.sel = (G.sel + 1) % N; S('select'); }
    if (anyOf(MK.ok)) {
      G.demo = false; S('decide');
      const id = menu[G.sel].id;
      if (id === 'story') openSelect('story');
      else if (id === 'versus') openSelect('versus');
      else if (id === 'host' || id === 'join') openSelect(id);
      else startTutorial();
    }
    return;
  }
  if (m === 'select') { selectTick(any, anyOf); return; }
  if (m === 'prologue') {
    G.mapT++;
    if (G.mapT > 60 && anyOf(MK.ok)) { if (G.mapT < 300) G.mapT = 300; else { S('page'); G.mode = 'map'; G.mapT = 0; } }
    if (anyOf(MK.back)) toTitle();
    return;
  }
  if (m === 'map') {
    const S0 = G.story, shinNew = !!S0.ladder[S0.idx].shin && S0.fresh;
    G.mapT++; if (G.mapT === 1) S('page');
    if (shinNew && G.mapT === SHIN_MAP.PATH) { S('gong'); }
    if (G.mapT > mapReady(S0) && anyOf(MK.ok)) {
      S('decide');
      if (shinNew) { S0.fresh = false; G.mode = 'omen'; G.omenT = OMEN.SWITCH - 1; }   // 着いた先で、真打が現れる
      else toCard();
    }
    if (anyOf(MK.back)) toTitle();
    return;
  }
  if (m === 'card') {
    G.cardT++; if (G.cardT === 2) S('taiko');
    if (G.cardT > 50 && anyOf(MK.ok)) startStoryMatch();
    else if (G.cardT > 24 && G.cardT < 50 && anyOf(MK.ok)) G.cardT = 50;
    if (anyOf(MK.back)) toTitle();
    return;
  }
  if (m === 'gameover') {
    G.endT++; if (G.p) { fightStep(false); updateBars(); }
    const S0 = G.story;
    if (!S0.over) {   // コンティニュー受付
      const c = G.endT - CONT_AT;
      if (c >= 0) {
        if (c % 60 === 0 && c < CONT_FR) S('tick');
        if (anyOf(MK.ok)) { S('decide'); S0.lives = S0.shown = LIVES; S0.continues++; S0.retry = true; toCard(); }
        else if (anyOf(MK.back) || c >= CONT_FR) { S('cancel'); S0.over = true; G.endT = 0; }
      }
    } else if (G.endT > 60 && anyOf(MK.ok)) { S('select'); toTitle(); }
    return;
  }
  if (m === 'omen') { omenTick(anyOf); return; }
  if (m === 'ending') {
    G.endT++; if (G.p) { fightStep(false); updateBars(); }
    if (G.endT > 280 && anyOf(MK.ok)) { S('select'); toTitle(); }
    return;
  }
  if (m === 'lobby') { lobbyTick(any); return; }
  if (m === 'netmsg') { if (anyOf(MK.ok) || anyOf(MK.back)) { S('select'); toTitle(); } return; }
  // ---- 試合（intro / fight / ko） ----
  if (!G.p) return;
  updateBars();
  if (m === 'intro' && anyOf(MK.back)) { toTitle(); return; }
  if (m === 'fight') {
    if (anyOf(MK.back)) { toTitle(); return; }
    if (any('KeyP', 'Pad0S', 'Pad1S')) G.paused = !G.paused;
    if (G.paused) return;
    if (G.kind === 'versus') { humanFeed(G.p, KEYS.p1, pr); humanFeed(G.c, KEYS.p2, pr); }
    else if (!(G.kind === 'tutorial' && G.tut && TUT[G.tut.step].final)) humanFeed(G.p, KEYS.solo, pr);
  }
  const rec = (m === 'fight' || m === 'ko') && G.rec && G.kind !== 'tutorial';
  let entry = null;
  if (rec) { entry = { st: saveState(), b: null }; G.rec.log.push(entry); if (G.rec.log.length > 480) G.rec.log.shift(); }
  G.lastBits = null;
  simTick();
  if (entry) entry.b = G.lastBits;
  if (m !== 'ko' && G.mode === 'ko') onKO();
  musicIntensity();
  if (G.kind === 'tutorial') { tutTick(anyOf, pr); if (anyOf(MK.back)) toTitle(); return; }
  if (G.mode === 'ko' && G.koT > 110) resultInput(any, anyOf);
}

      tbtn('copy', 'コードをコピー', W / 2 - 150, 470, 270, 64, () => { if (navigator.clipboard) navigator.clipboard.writeText(L.code).then(() => { if (G.lobby === L) L.msg = 'コードをコピーしました'; }, () => {}); }, { primary: true });
      tbtn('close', '部屋を閉じる', W / 2 + 150, 470, 270, 64, press('Escape'));
    } else txt('C : コードをコピー　　Esc : 部屋を閉じる', W / 2, 480, 20, '#c8b8a0');
  } else if (L.phase === 'input' && TOUCH.on) {
    txt('部屋コードを入力してください', W / 2, 140, 22, '#e8d8b0', 'center', FONT_SERIF);
    for (let i = 0; i < NET.CODE_LEN; i++) {
      const x = W / 2 + (i - (NET.CODE_LEN - 1) / 2) * 66;
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x - 27, 160, 54, 56);
      ctx.strokeStyle = i === L.code.length ? '#ffe680' : '#8a7a6a'; ctx.lineWidth = 3; ctx.strokeRect(x - 27, 160, 54, 56);
      if (L.code[i]) txt(L.code[i], x, 189, 40, '#ffffff', 'center', FONT_SANS, '#000', 5);
    }
    const keysList = [...NET.CODE_CHARS, '⌫'], cols = 8, kw = 98, kh = 50, gap = 6, x0 = (W - (cols * kw + (cols - 1) * gap)) / 2;
    keysList.forEach((ch, i) => {
      const cx = x0 + (i % cols) * (kw + gap) + kw / 2, cy = 252 + Math.floor(i / cols) * (kh + gap);
      tbtn('k' + ch, ch, cx, cy, kw, kh, () => { if (ch === '⌫') L.code = L.code.slice(0, -1); else if (L.code.length < NET.CODE_LEN) L.code += ch; }, { size: 26, font: FONT_SANS });
    });
    const full = L.code.length === NET.CODE_LEN;
    tbtn('paste', '貼り付け', W / 2 - 260, 500, 220, 50, () => { if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(t => { if (G.lobby === L) L.code = cleanCode(t); }, () => {}); }, { size: 22 });
    tbtn('back', '戻る', W / 2, 500, 220, 50, press('Escape'), { size: 22 });
    tbtn('join', '接続する', W / 2 + 260, 500, 220, 50, () => { if (full) G.pressed.add('Enter'); }, { size: 22, primary: full });
  } else if (L.phase === 'input') {
    txt('部屋コードを入力してください', W / 2, 160, 24, '#e8d8b0', 'center', FONT_SERIF);
    codeBoxes(L.code, 246, true);
    if (L.code.length === NET.CODE_LEN && (G.time >> 4) % 2 === 0) txt('Enter で接続', W / 2, 340, 24, '#ffe680');
    txt('英数字キーで入力（貼り付けも可）　Backspace : 1文字消す　　Esc : 戻る', W / 2, 480, 18, '#c8b8a0');
  } else if (L.phase === 'connecting' || L.phase === 'connected') {
    txt(L.phase === 'connected' ? '接続しました。立ち合いを準備しています' + dots : '部屋「' + L.code + '」に接続しています' + dots, W / 2, 250, 26, '#ffffff', 'center', FONT_SERIF);
    if (TOUCH.on) tbtn('cancel', 'やめる', W / 2, 470, 260, 64, press('Escape')); else txt('Esc : やめる', W / 2, 480, 20, '#c8b8a0');
  } else {
    txt('接続できませんでした', W / 2, 210, 32, '#ff8070', 'center', FONT_SERIF);
    txt(L.msg || '', W / 2, 270, 20, '#ffffff');
    if (TOUCH.on) tbtn('errtitle', 'タイトルへ', W / 2, 470, 280, 64, press('Enter'), { primary: true }); else txt('Z / Enter : タイトルへ', W / 2, 480, 22, '#f3d27a');
  }
}
function renderNetMsg() {
  const W = W3;
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H3);
  txt('対戦終了', W / 2, 200, 40, '#f3d27a', 'center', FONT_SERIF, '#2a0a0a', 10);
  txt(G.netMsg || '', W / 2, 280, 22, '#ffffff', 'center', FONT_SERIF);
  if (TOUCH.on) tbtn('msgtitle', 'タイトルへ', W / 2, 460, 280, 64, press('Enter'), { primary: true }); else txt('Z / Enter : タイトルへ', W / 2, 460, 22, '#f3d27a');
}
function renderNetStatus() {
  const n = G.net, ms = Math.round(n.rtt);
  const col = !ms ? '#c8c8c8' : ms < 80 ? '#90e090' : ms < 160 ? '#f0d070' : '#ff8070';
  const route = n.route === 'direct' ? '・直結' : n.route === 'relay' ? '・中継' : '';
  txt(`通信 ${ms ? ms + 'ms' : '—'}${route}`, 10, H3 - 12, 13, col, 'left');
  if (n.stallT > 20) txt('相手の通信を待っています…', W3 / 2, 90 * K, 22, '#ffe680', 'center', FONT_SERIF);
  else if (n.inMatch && G.mode === 'fight' && n.simF - n.lastRemote > NET.LATE_NOTICE) txt('相手の通信が遅れています', W3 - 10, H3 - 32, 14, '#ffd080', 'right');
  if (n.desync) txt('※同期ずれを検出しました', 10, H3 - 32, 13, '#ff8070', 'left');
}

/* =====================================================================
   入力（キーボード・ゲームパッド・タッチ）
   ===================================================================== */
function keyDown(code, key = '', repeat = false) {
  Snd.init();
  keys[code] = true;
  if (repeat) return;
  G.pressed.add(code);
  if (G.mode === 'lobby' && G.lobby && G.lobby.phase === 'input' && key.length === 1) G.typed.push(key.toUpperCase());
}
function keyUp(code) { keys[code] = false; }
function setKey(code, on) { if (on && !keys[code]) keyDown(code); else if (!on && keys[code]) keyUp(code); }
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyZ', 'KeyX', 'KeyC', 'Slash', 'Semicolon', 'Quote'].includes(e.code)) e.preventDefault();
  keyDown(e.code, e.key, e.repeat);
});
window.addEventListener('paste', e => {
  if (G.mode !== 'lobby' || !G.lobby || G.lobby.phase !== 'input') return;
  G.lobby.code = cleanCode((e.clipboardData && e.clipboardData.getData('text')) || '');
});
window.addEventListener('keyup', e => keyUp(e.code));
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
window.addEventListener('mousedown', () => Snd.init());
// ゲームパッド（標準配置：□/X＝斬、×/A＝守、○/B・△/Y＝突、START＝決定・一時停止、SELECT＝戻る）
function pollPads() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let idx = 0;
  for (const gp of gps) {
    if (!gp || idx > 1) continue;
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const st = { L: b(14) || ax < -0.5, R: b(15) || ax > 0.5, U: b(12) || ay < -0.5, D: b(13) || ay > 0.5,
      A: b(2) || b(5) || b(7), G: b(0) || b(4) || b(6), T: b(1) || b(3), S: b(9), E: b(8) };
    for (const k in st) {
      const code = 'Pad' + idx + k;
      if (st[k] && !keys[code]) { keys[code] = true; G.pressed.add(code); }
      else if (!st[k]) keys[code] = false;
    }
    idx++;
  }
}

/* ---- スマホ・タブレット ---- */
const TOUCH = { on: false, kind: 'pc', portrait: false, pads: false, w: 0, h: 0 };
const $id = id => document.getElementById(id);
const padAct = $id('padAct'), padMove = $id('padMove'), bAtk = $id('bAtk'), bGrd = $id('bGrd'), bThr = $id('bThr'), bLeft = $id('bLeft'), bRight = $id('bRight');
const hintEl = $id('hint');
for (const el of [padAct, padMove, hintEl]) el.style.fontFamily = FONT_SERIF;
function touchDevice() { const mq = q => window.matchMedia && window.matchMedia(q).matches; return mq('(pointer: coarse)') || (navigator.maxTouchPoints > 0 && !mq('(pointer: fine)')); }
function deviceKind() { const s = Math.min(screen.width || window.innerWidth, screen.height || window.innerHeight); return s < 600 ? 'phone' : 'tablet'; }
function enableTouch() { if (TOUCH.on) return; TOUCH.on = true; TOUCH.kind = deviceKind(); G.sel = 0; fit(); }
if (touchDevice()) { TOUCH.on = true; TOUCH.kind = deviceKind(); }
window.addEventListener('touchstart', () => { Snd.init(); enableTouch(); }, { passive: true });
window.addEventListener('touchend', () => Snd.init(), { passive: true });
for (const ev of ['gesturestart', 'dblclick', 'contextmenu']) document.addEventListener(ev, e => e.preventDefault());
const vibrate = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 非対応 */ } };
const rectOf = el => el.getBoundingClientRect();
const centerDist = (el, x, y) => { const r = rectOf(el); return Math.hypot(x - (r.left + r.right) / 2, y - (r.top + r.bottom) / 2); };
const moveFingers = new Map();
function updateMove() {
  let dir = 0;
  const f = [...moveFingers.values()].pop();
  if (f) { const a = rectOf(bLeft), b = rectOf(bRight); dir = f.x < (a.right + b.left) / 2 ? -1 : 1; }
  setKey('ArrowLeft', dir < 0); setKey('ArrowRight', dir > 0);
  bLeft.classList.toggle('on', dir < 0); bRight.classList.toggle('on', dir > 0);
}
padMove.addEventListener('pointerdown', e => { e.preventDefault(); Snd.init(); try { padMove.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ } moveFingers.set(e.pointerId, { x: e.clientX }); updateMove(); });
padMove.addEventListener('pointermove', e => { const f = moveFingers.get(e.pointerId); if (f) { f.x = e.clientX; updateMove(); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) padMove.addEventListener(ev, e => { if (moveFingers.delete(e.pointerId)) updateMove(); });
const actFingers = new Map();
const ACT_KEYS = { atk: 'KeyZ', grd: 'KeyX', thr: 'KeyC' }, ACT_EL = { atk: bAtk, grd: bGrd, thr: bThr };
const actAt = (x, y) => Object.keys(ACT_EL).reduce((best, k) => centerDist(ACT_EL[k], x, y) < centerDist(ACT_EL[best], x, y) ? k : best, 'atk');
const fingersOn = b => [...actFingers.values()].filter(v => v === b).length;
function actPress(b) { vibrate(8); keyDown(ACT_KEYS[b]); }
function actRelease(b) { if (!fingersOn(b)) keyUp(ACT_KEYS[b]); }
function updateActView() { for (const k in ACT_EL) ACT_EL[k].classList.toggle('on', fingersOn(k) > 0); }
padAct.addEventListener('pointerdown', e => { e.preventDefault(); Snd.init(); try { padAct.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ } const b = actAt(e.clientX, e.clientY); actFingers.set(e.pointerId, b); actPress(b); updateActView(); });
padAct.addEventListener('pointermove', e => { const cur = actFingers.get(e.pointerId); if (!cur) return; const b = actAt(e.clientX, e.clientY); if (b !== cur) { actFingers.set(e.pointerId, b); actRelease(cur); actPress(b); updateActView(); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) padAct.addEventListener(ev, e => { const cur = actFingers.get(e.pointerId); if (!cur) return; actFingers.delete(e.pointerId); actRelease(cur); updateActView(); });
function releaseAllTouch() { moveFingers.clear(); actFingers.clear(); updateMove(); for (const k in ACT_KEYS) setKey(ACT_KEYS[k], false); updateActView(); }
const HOT = { list: [], downId: null };
function hot(id, x, y, w, h, fn) { HOT.list.push({ id, x, y, w, h, fn }); }
function hitHot(e) {
  const r = rectOf(cv), x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  for (let i = HOT.list.length - 1; i >= 0; i--) { const h = HOT.list[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; }
  return null;
}
cv.addEventListener('pointerdown', e => { Snd.init(); const h = hitHot(e); HOT.downId = h ? h.id : null; });
cv.addEventListener('pointerup', e => { const h = hitHot(e), id = HOT.downId; HOT.downId = null; if (h && h.id === id) { vibrate(6); h.fn(); } });
cv.addEventListener('pointercancel', () => { HOT.downId = null; });
const press = code => () => G.pressed.add(code);
function tbtn(id, label, cx, cy, w, h, fn, o = {}) {
  const x = cx - w / 2, y = cy - h / 2, down = HOT.downId === id;
  ctx.fillStyle = down ? 'rgba(200,60,50,0.9)' : o.primary ? 'rgba(140,22,22,0.85)' : 'rgba(28,18,26,0.82)';
  ctx.strokeStyle = o.primary ? '#ffe680' : 'rgba(243,210,122,0.6)'; ctx.lineWidth = 3;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, 16); else ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  txt(label, cx, cy + 1, o.size || Math.min(30, Math.round(h * 0.46)), o.primary ? '#ffe680' : '#f3e6c0', 'center', o.font || FONT_SERIF);
  hot(id, x, y, w, h, fn);
}
function tapAnywhere(id, fn) { hot(id, 0, 0, cv.width, cv.height, fn); }
const canFullscreen = () => !!(document.fullscreenEnabled && document.documentElement.requestFullscreen) && !document.fullscreenElement;
function goFullscreen() {
  document.documentElement.requestFullscreen().then(() => { if (TOUCH.kind === 'phone' && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }).catch(() => {});
}
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
function place(el, x, y, w, h) { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); }
function fit() {
  const W = window.innerWidth, H = window.innerHeight;
  TOUCH.w = W; TOUCH.h = H; TOUCH.portrait = H > W;
  let cw, chh, cx, cy, hintTop = -1;
  if (!TOUCH.on) { const s = Math.min(W / cv.width, H / cv.height); cw = Math.floor(cv.width * s); chh = Math.floor(cv.height * s); cx = (W - cw) / 2; cy = (H - chh) / 2; }
  else if (TOUCH.kind === 'phone' && TOUCH.portrait) {
    const panel = Math.round(clampN(H * 0.42, 200, 420));
    cw = Math.min(W, (H - panel) * 16 / 9); chh = cw * 9 / 16; cx = (W - cw) / 2; cy = Math.max(0, (H - panel - chh) / 2);
    placeBottomPanel(W, H, cy + chh, 12);
    if (!TOUCH.pads) hintTop = cy + chh;
  } else if (TOUCH.kind === 'phone' && !TOUCH.pads) { const s = Math.min(W / cv.width, H / cv.height); cw = cv.width * s; chh = cv.height * s; cx = (W - cw) / 2; cy = (H - chh) / 2; }
  else if (TOUCH.kind === 'phone') {
    const col = Math.round(clampN(W * 0.19, 118, 200));
    cw = Math.min(W - col * 2, H * 16 / 9); chh = cw * 9 / 16; cx = (W - cw) / 2; cy = (H - chh) / 2;
    place(padMove, 0, 0, col, H); place(padAct, W - col, 0, col, H);
    const g = 8, bw = col - g * 2, bh = Math.min((H - g * 4) / 3, bw * 0.95);
    place(bThr, g, H - bh * 3 - g * 3, bw, bh); place(bAtk, g, H - bh * 2 - g * 2, bw, bh); place(bGrd, g, H - bh - g, bw, bh);
    const mw = (col - g * 3) / 2, mh = Math.min(H * 0.62, 240);
    place(bLeft, g, H - mh - g, mw, mh); place(bRight, g * 2 + mw, H - mh - g, mw, mh);
    for (const el of [bAtk, bGrd, bThr]) el.style.fontSize = Math.round(clampN(bw * 0.26, 20, 34)) + 'px';
    for (const el of [bLeft, bRight]) el.style.fontSize = Math.round(clampN(mw * 0.5, 24, 44)) + 'px';
  } else {
    const panel = Math.round(clampN(H * (TOUCH.portrait ? 0.3 : 0.24), 160, 330));
    cw = Math.min(W, (H - panel) * 16 / 9); chh = cw * 9 / 16; cx = (W - cw) / 2; cy = Math.max(0, (H - panel - chh) / 2);
    placeBottomPanel(W, H, cy + chh, 18);
  }
  Object.assign(cv.style, { left: cx + 'px', top: cy + 'px', width: cw + 'px', height: chh + 'px' });
  hintEl.style.display = hintTop >= 0 ? 'flex' : 'none';
  if (hintTop >= 0) place(hintEl, 0, hintTop, W, H - hintTop);
}
function placeBottomPanel(W, H, top, g) {
  const ph = H - top;
  const mvW = Math.round(W * (TOUCH.portrait ? 0.4 : 0.46)), acW = W - mvW;   // 縦向きは操作ボタンの側を広く
  place(padMove, 0, top, mvW, ph); place(padAct, mvW, top, acW, ph);
  const bw = Math.min((acW - g * 4) / 3, 190), mw = Math.min((mvW - g * 3) / 2, 210);
  const bh = Math.min(ph - g * 2, Math.max(bw * 1.2, Math.min(bw * 1.8, 260)));
  const by = Math.max(g, ph - bh - Math.max(g * 2, ph * 0.1));
  place(bLeft, g, by, mw, bh); place(bRight, g * 2 + mw, by, mw, bh);
  place(bThr, acW - g * 3 - bw * 3, by + bh * 0.22, bw, bh * 0.78); place(bGrd, acW - g * 2 - bw * 2, by, bw, bh); place(bAtk, acW - g - bw, by, bw, bh);
  for (const el of [bAtk, bGrd, bThr]) el.style.fontSize = Math.round(clampN(bw * 0.3, 20, 44)) + 'px';
  for (const el of [bLeft, bRight]) el.style.fontSize = Math.round(clampN(mw * 0.4, 26, 60)) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => { fit(); setTimeout(fit, 250); setTimeout(fit, 800); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', () => setTimeout(fit, 100));
fit();
function touchFrame() {
  if (TOUCH.on && (window.innerWidth !== TOUCH.w || window.innerHeight !== TOUCH.h)) fit();
  const show = TOUCH.on && !G.replay && (G.mode === 'intro' || G.mode === 'fight' || G.mode === 'ko');
  if (padAct.classList.contains('show') !== show) {
    padAct.classList.toggle('show', show); padMove.classList.toggle('show', show);
    if (!show) releaseAllTouch();
    TOUCH.pads = show; fit();
  }
}

/* ---- メインループ（requestAnimationFrame + 固定60fps更新） ---- */
const STEP = 1000 / 60;
let acc = 0, last = performance.now(), fadeT = 0, fadeLast = '';
function loop(now) {
  acc += Math.min(G.net && G.net.inMatch ? NET.CATCHUP_MAX_MS : 100, now - last); last = now;
  while (acc >= STEP) { acc -= STEP; tick(); }
  Music.update();
  touchFrame();
  render();
  // 画面の切り替わりは黒から溶け込ませる（試合中の intro→fight→ko は除く）
  const inMatch = mm => mm === 'intro' || mm === 'fight' || mm === 'ko';
  if (G.mode !== fadeLast) { if (!(inMatch(G.mode) && inMatch(fadeLast))) fadeT = 16; fadeLast = G.mode; }
  if (fadeT > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeT / 16})`; ctx.fillRect(0, 0, W3, H3); fadeT--; }
  requestAnimationFrame(loop);
}
toTitle();
requestAnimationFrame(loop);

</script>
